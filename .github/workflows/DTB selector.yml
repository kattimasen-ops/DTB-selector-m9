name: Run DTB Selector

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  process-dtb:
    name: Execute DTB Selector
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pseudo-Terminal Dependency
        run: python -m pip install pywinpty

      - name: Execute DTB Selector in Pseudo Console
        shell: python
        run: |
          import time
          import sys
          from winpty import PtyProcess

          print("Launching dtb_selector_win32.exe inside Pseudo Console...")
          # Spawn the EXE inside a real ConPTY session
          proc = PtyProcess.spawn('dtb_selector_win32.exe')

          # Wait for the Language menu and send '1' (English) + Enter
          time.sleep(3)
          proc.write('1\r\n')

          # Wait for subsequent selection prompt and send '1' + Enter
          time.sleep(2)
          proc.write('1\r\n')

          # Give process time to complete file copying/operations
          time.sleep(5)

          # Print terminal output log
          try:
              output = proc.read()
              print(output)
          except Exception as e:
              print(f"Process finished: {e}")

          proc.close()

      - name: Upload Output Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dtb-selector-output
          path: |
            *.dtb
            *.ini
            *.txt
            *.log
          retention-days: 7
